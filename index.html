<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>GABRIEL STAR</title>

<style>
body{margin:0;background:#05070d;color:#fff;font-family:Arial}
#login{display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#0c0f18;padding:30px;border-radius:15px;width:300px;text-align:center}

input,select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#00cfff;
  cursor:pointer;
  width:100%;
}

/* PANEL */
#panel{display:none;height:100vh;display:flex}
.sidebar{width:200px;background:#0c0f18;padding:20px}
.content{flex:1;padding:20px}

.card{background:#0c0f18;padding:20px;border-radius:12px;margin-bottom:20px}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0a0d14;
  padding:10px;
  border-radius:8px;
  margin-bottom:5px;
}

.key{color:#00cfff}

.actions button{
  width:auto;
  margin-left:5px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h2>GABRIEL STAR</h2>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <p id="msg"></p>
  </div>
</div>

<!-- PANEL -->
<div id="panel">

<div class="sidebar">
  <h3>Painel</h3>
  <p>Keys Ativas: <span id="count">0</span></p>
</div>

<div class="content">

<div class="card">
<h3>Gerar Keys</h3>

<input id="quantidade" placeholder="Quantidade (ex: 10)">

<select id="dias">
  <option value="1">1 dia</option>
  <option value="7">7 dias</option>
  <option value="15">15 dias</option>
  <option value="30">30 dias</option>
  <option value="50">50 dias</option>
  <option value="99999">Permanente</option>
</select>

<button onclick="gerar()">GERAR KEYS</button>
</div>

<div class="card">
<h3>Lista</h3>
<div id="lista"></div>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔴 COLOCA SUA CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDFMv_ZmrVqdgwWO2O-G4hcKFcxi-oxri0",
  authDomain: "gabriel-xiter-fa4b1.firebaseapp.com",
  projectId: "1:532789318640:web:880cf6e95237a182084335"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// LOGIN
window.login = function(){
  if(user.value==="gabriel-12" && pass.value==="040612"){
    login.style.display="none";
    panel.style.display="flex";
    realtime();
  } else {
    msg.innerText="Inválido ❌";
  }
}

// GERAR VARIAS KEYS
window.gerar = async function(){

  let qtd = parseInt(document.getElementById("quantidade").value) || 1;
  let dias = parseInt(document.getElementById("dias").value);

  for(let i=0;i<qtd;i++){

    let key = "GABRIEL-" + Math.random().toString(36).substring(2,10).toUpperCase();

    let exp = Date.now() + (dias * 86400000);

    await addDoc(collection(db,"keys"),{
      key:key,
      expires:exp,
      paused:false
    });

  }

}

// TEMPO REAL
function realtime(){

  const lista = document.getElementById("lista");

  onSnapshot(collection(db,"keys"), (snap)=>{

    lista.innerHTML="";
    let count=0;

    snap.forEach(d=>{

      let data = d.data();
      let id = d.id;

      if(!data.paused) count++;

      lista.innerHTML += `
      <div class="row">
        <span class="key">${data.key}</span>
        <span>${new Date(data.expires).toLocaleDateString()}</span>
        <div class="actions">
          <button onclick="copiar('${data.key}')">📋</button>
          <button onclick="toggle('${id}',${data.paused})">⏯</button>
          <button onclick="del('${id}')">🗑</button>
        </div>
      </div>`;
    });

    document.getElementById("count").innerText=count;

  });
}

// COPIAR
window.copiar = function(key){
  navigator.clipboard.writeText(key);
  alert("Copiado: "+key);
}

// DELETE
window.del = async function(id){
  await deleteDoc(doc(db,"keys",id));
}

// PAUSE
window.toggle = async function(id,p){
  await updateDoc(doc(db,"keys",id),{
    paused:!p
  });
}

</script>

</body>
</html>
