<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gabriel Star</title>

<style>
body{background:#05070d;color:#fff;font-family:Arial;text-align:center}
input,select,button{margin:5px;padding:10px}
#painel{display:none}
</style>

</head>
<body>

<h2>LOGIN</h2>

<input id="user" placeholder="usuario"><br>
<input id="pass" type="password" placeholder="senha"><br>

<button onclick="login()">Entrar</button>

<p id="msg"></p>

<div id="painel">

<h2>GERAR KEYS</h2>

<input id="qtd" placeholder="quantidade"><br>

<select id="dias">
<option value="1">1 dia</option>
<option value="7">7 dias</option>
<option value="30">30 dias</option>
<option value="99999">permanente</option>
</select>

<br>
<button onclick="gerar()">GERAR</button>

<h3>LISTA</h3>
<div id="lista"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 👉 COLE SUA CONFIG AQUI
const firebaseConfig = {
  apiKey: "AIzaSyDFMv_ZmrVqdgwWO2O-G4hcKFcxi-oxri0",
  authDomain: "gabriel-xiter-fa4b1.firebaseapp.com", projectId",
  projectId: "1:532789318640:web:880cf6e95237a182084335"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// LOGIN
window.login = function(){

  if(user.value==="gabriel-12" && pass.value==="040612"){
    document.getElementById("painel").style.display="block";
    document.getElementById("msg").innerText="Logado";
    tempoReal();
  } else {
    msg.innerText="errado";
  }

}

// GERAR
window.gerar = async function(){

  let qtd = parseInt(qtd.value) || 1;
  let dias = parseInt(document.getElementById("dias").value);

  for(let i=0;i<qtd;i++){

    let key = "GABRIEL-" + Math.random().toString(36).substring(2,10);

    let exp = Date.now() + dias*86400000;

    await addDoc(collection(db,"keys"),{
      key:key,
      expires:exp
    });

  }

}

// TEMPO REAL
function tempoReal(){

  onSnapshot(collection(db,"keys"), (snap)=>{

    lista.innerHTML="";

    snap.forEach(d=>{
      lista.innerHTML += `<p>${d.data().key}</p>`;
    });

  });

}

</script>

</body>
</html>
