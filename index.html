<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GABRIEL STAR - Admin Keys</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
  text-align:center;
}

#login{ margin-top:100px; }

input{
  padding:10px;
  margin:5px;
  border:none;
}

button{
  padding:8px 15px;
  margin:5px;
  background:red;
  color:#fff;
  border:none;
  cursor:pointer;
  border-radius:5px;
}

#panel{ display:none; }

.key{
  background:#111;
  margin:10px auto;
  padding:15px;
  border-radius:10px;
  width:280px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>GABRIEL STAR</h2>
  <input id="user" placeholder="Usuário"><br>
  <input id="pass" type="password" placeholder="Senha"><br>
  <button onclick="login()">Entrar</button>
</div>

<!-- PAINEL -->
<div id="panel">
  <h2>Gerador de Keys</h2>

  <button onclick="gerar(1)">1 Dia</button>
  <button onclick="gerar(7)">7 Dias</button>
  <button onclick="gerar(30)">30 Dias</button>

  <h2>Keys</h2>
  <div id="keys"></div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDFMv_ZmrVqdgwWO2O-G4hcKFcxi-oxri0",
  authDomain: "gabriel-xiter.firebaseapp.com",
  projectId: "gabriel-xiter",
  storageBucket: "gabriel-xiter.appspot.com",
  messagingSenderId: "593212348463",
  appId: "1:532789318640:web:880cf6e95237a182084335"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LOGIN */
window.login = function(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u === "gabriel-12" && p === "040612"){
    document.getElementById("login").style.display="none";
    document.getElementById("panel").style.display="block";
    carregarKeys();
  }else{
    alert("Login errado");
  }
}

/* GERAR KEY */
window.gerar = async function(dias){

  let key = "GAB-" + dias + "D-" + Math.random().toString(36).substring(2,10).toUpperCase();
  let exp = Date.now() + dias*86400000;

  await addDoc(collection(db, "keys"), {
    key: key,
    expires: exp,
    paused: false
  });

  carregarKeys();
}

/* CARREGAR KEYS */
async function carregarKeys(){
  let div = document.getElementById("keys");
  div.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "keys"));

  querySnapshot.forEach((docSnap) => {
    let data = docSnap.data();

    let html = `
    <div class="key">
      <b>${data.key}</b><br>
      Status: ${data.paused ? "Pausado" : "Ativo"}<br>
      Expira: ${new Date(data.expires).toLocaleString()}<br><br>

      <button onclick="deletar('${docSnap.id}')">Deletar</button>
      <button onclick="pausar('${docSnap.id}', ${data.paused})">
        ${data.paused ? "Despausar" : "Pausar"}
      </button>
    </div>
    `;

    div.innerHTML += html;
  });
}

/* DELETAR */
window.deletar = async function(id){
  await deleteDoc(doc(db, "keys", id));
  carregarKeys();
}

/* PAUSAR */
window.pausar = async function(id, status){
  await updateDoc(doc(db, "keys", id), {
    paused: !status
  });
  carregarKeys();
}
</script>

</body>
</html>
