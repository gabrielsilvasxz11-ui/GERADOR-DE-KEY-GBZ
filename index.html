<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin Keys</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
  text-align:center;
}

#login{
  margin-top:100px;
}

input{
  padding:10px;
  margin:5px;
  border:none;
}

button{
  padding:8px 15px;
  margin:5px;
  background:red;
  color:#fff;
  border:none;
  cursor:pointer;
}

#panel{
  display:none;
}

.key{
  background:#111;
  margin:10px;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>Login</h2>
  <input id="user" placeholder="Usuário"><br>
  <input id="pass" type="password" placeholder="Senha"><br>
  <button onclick="login()">Entrar</button>
</div>

<!-- PAINEL -->
<div id="panel">
  <h2>Gerador</h2>

  <button onclick="gerar(1)">1 Dia</button>
  <button onclick="gerar(7)">7 Dias</button>
  <button onclick="gerar(20)">20 Dias</button>
  <button onclick="gerar(50)">50 Dias</button>

  <h2>Keys</h2>
  <div id="keys"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔑 COLE SUA CONFIG DO FIREBASE AQUI */
const firebaseConfig = {
  apiKey: "AIzaSyCION6HiITfm5U5ynTldboq-srSsihs9Mc",
  authDomain: "gabriel-xiter.firebaseapp.com",
  projectId: "gabriel-xiter"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LOGIN */
window.login = function(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u === "gabriel-12" && p === "040612"){
    document.getElementById("login").style.display="none";
    document.getElementById("panel").style.display="block";
    carregarKeys();
  }else{
    alert("Login errado");
  }
}

/* GERAR KEY */
window.gerar = async function(dias){
  let key = "GAB-" + dias + "D-" + Math.random().toString(36).substring(2,10).toUpperCase();
  let exp = Date.now() + dias*86400000;

  await addDoc(collection(db,"keys"),{
    key: key,
    expires: exp,
    active: true,
    paused: false,
    device: null
  });

  alert("Key criada: " + key);
}

/* LISTAR KEYS */
function carregarKeys(){
  onSnapshot(collection(db,"keys"), snapshot => {

    let html = "";

    snapshot.forEach(docSnap => {
      let d = docSnap.data();

      let status = "Ativa";
      if(d.paused) status = "Pausada";
      if(Date.now() > d.expires) status = "Expirada";

      html += `
      <div class="key">
        <b>${d.key}</b><br>
        Status: ${status}<br>
        Expira: ${new Date(d.expires).toLocaleString()}<br>

        <button onclick="pausar('${docSnap.id}')">Pausar</button>
        <button onclick="ativar('${docSnap.id}')">Ativar</button>
        <button onclick="deletar('${docSnap.id}')">Deletar</button>
      </div>
      `;
    });

    document.getElementById("keys").innerHTML = html;
  });
}

/* AÇÕES */
window.pausar = async function(id){
  await updateDoc(doc(db,"keys",id), {paused:true});
}

window.ativar = async function(id){
  await updateDoc(doc(db,"keys",id), {paused:false});
}

window.deletar = async function(id){
  await deleteDoc(doc(db,"keys",id));
}

</script>

</body>
</html>
