<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>GABRIEL STAR ADMIN</title>

<style>
body{
  margin:0;
  background:#05070d;
  color:#fff;
  font-family:Arial;
}

/* LOGIN */
#login{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#0c0f18;
  padding:30px;
  border-radius:15px;
  width:300px;
  text-align:center;
  box-shadow:0 0 30px rgba(0,255,255,0.2);
}

input, select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#00cfff;
  cursor:pointer;
  width:100%;
}

/* PANEL */
#panel{
  display:none;
  padding:20px;
}

.card{
  background:#0c0f18;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

.key{color:#00cfff;}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  background:#0a0d14;
  padding:10px;
  border-radius:8px;
}

.actions button{
  width:auto;
  margin-left:5px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h2>GABRIEL STAR</h2>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <p id="msg"></p>
  </div>
</div>

<!-- PANEL -->
<div id="panel">

<div class="card">
<h3>Gerar Key</h3>

<select id="dias">
  <option value="1">1 dia</option>
  <option value="7">7 dias</option>
  <option value="15">15 dias</option>
  <option value="30">30 dias</option>
  <option value="50">50 dias</option>
  <option value="99999">Permanente</option>
</select>

<button onclick="gerar()">GERAR</button>
</div>

<div class="card">
<h3>Keys</h3>
<div id="lista"></div>
</div>

</div>

<script type="module">

// 🔥 IMPORTS FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔴 COLOCA SUA CONFIG DO FIREBASE AQUI
const firebaseConfig = {
  apiKey: "AIzaSyDFMv_ZmrVqdgwWO2O-G4hcKFcxi-oxri0",
  authDomain: "gabriel-xiter-fa4b1.firebaseapp.com",
  projectId: "1:532789318640:web:880cf6e95237a182084335"
};

// 🔥 INICIAR FIREBASE
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔐 LOGIN FIXO
window.login = function(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u === "gabriel-12" && p === "040612"){
    document.getElementById("login").style.display="none";
    document.getElementById("panel").style.display="block";
    carregar();
  } else {
    document.getElementById("msg").innerText="Inválido ❌";
  }
}

// 🔑 GERAR KEY
window.gerar = async function(){

  let dias = parseInt(document.getElementById("dias").value);

  let key = "GABRIEL-" + Math.random().toString(36).substring(2,10).toUpperCase();

  let exp = Date.now() + (dias * 86400000);

  await addDoc(collection(db,"keys"),{
    key: key,
    expires: exp,
    paused: false,
    device: ""
  });

  alert("KEY GERADA: " + key);

  carregar();
}

// 📦 LISTAR KEYS
async function carregar(){

  let lista = document.getElementById("lista");
  lista.innerHTML="";

  const snap = await getDocs(collection(db,"keys"));

  snap.forEach(d=>{

    let data = d.data();
    let id = d.id;

    let status = data.paused ? "⏸" : "✅";

    lista.innerHTML += `
    <div class="row">
      <span class="key">${data.key}</span>
      <span>${new Date(data.expires).toLocaleDateString()}</span>
      <span>${status}</span>
      <div class="actions">
        <button onclick="toggle('${id}',${data.paused})">⏯</button>
        <button onclick="del('${id}')">🗑</button>
      </div>
    </div>
    `;
  });
}

// 🗑 DELETAR
window.del = async function(id){
  await deleteDoc(doc(db,"keys",id));
  carregar();
}

// ⏯ PAUSAR / ATIVAR
window.toggle = async function(id,paused){
  await updateDoc(doc(db,"keys",id),{
    paused: !paused
  });
  carregar();
}

</script>

</body>
</html>
