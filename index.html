<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gabriel Star Admin</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDFMv_ZmrVqdgwWO2O-G4hcKFcxi-oxri0",
  authDomain: "gabriel-xiter-fa4b1.firebaseapp.com",
  projectId: "1:532789318640:web:880cf6e95237a182084335"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.login = async function(){

  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;
  const msg = document.getElementById("msg");

  msg.innerText = "Verificando...";

  const querySnapshot = await getDocs(collection(db, "keys"));

  let ok = false;

  querySnapshot.forEach((doc) => {
    const data = doc.data();

    if(data.key === user){ // usa campo user como key

      if(data.paused){
        msg.innerText = "Key pausada ❌";
        return;
      }

      if(Date.now() > data.expires){
        msg.innerText = "Expirada ❌";
        return;
      }

      ok = true;

      document.getElementById("login").style.display="none";
      document.getElementById("panel").style.display="flex";
    }
  });

  if(!ok){
    msg.innerText = "Inválido ❌";
  }
}
</script>
