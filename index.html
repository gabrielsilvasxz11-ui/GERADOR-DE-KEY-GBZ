<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gabriel Star Admin</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 CONFIG FIREBASE (COLOCA A SUA)
const firebaseConfig = {
  apiKey: "AIzaSyDFMv_ZmrVqdgwWO2O-G4hcKFcxi-oxri0",
  authDomain: "gabriel-xiter-fa4b1.firebaseapp.com",
  projectId: "1:532789318640:web:880cf6e95237a182084335 "
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔐 LOGIN FIXO
window.login = function(){
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;
  const msg = document.getElementById("msg");

  if(user === "gabriel-12" && pass === "040612"){
    document.getElementById("login").style.display="none";
    document.getElementById("panel").style.display="flex";
    loadKeys();
  } else {
    msg.innerText = "Inválido ❌";
  }
}

// 🔑 GERAR KEY
window.generateKeys = async function(){

  const qtd = document.getElementById("qtd").value;
  const dias = document.getElementById("dias").value;

  for(let i=0;i<qtd;i++){

    let key = "GABRIEL-" + Math.random().toString(36).substring(2,10).toUpperCase();

    let expires = Date.now() + (dias * 86400000);

    await addDoc(collection(db,"keys"),{
      key: key,
      expires: expires,
      paused: false,
      device: ""
    });
  }

  loadKeys();
}

// 📦 CARREGAR KEYS
async function loadKeys(){

  const tabela = document.getElementById("keysTable");
  tabela.innerHTML = "";

  const querySnapshot = await getDocs(collection(db,"keys"));

  querySnapshot.forEach((docSnap)=>{

    const data = docSnap.data();
    const id = docSnap.id;

    let dataExp = new Date(data.expires).toLocaleDateString();

    tabela.innerHTML += `
    <tr>
      <td class="key">${data.key}</td>
      <td>revendedor</td>
      <td>${dataExp}</td>
      <td><button onclick="delKey('${id}')">🗑</button></td>
    </tr>`;
  });
}

// 🗑 DELETAR
window.delKey = async function(id){
  await deleteDoc(doc(db,"keys",id));
  loadKeys();
}
</script>
