<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin Keys</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
  text-align:center;
}

/* LOGIN */
#login{
  margin-top:100px;
}

input{
  padding:10px;
  margin:5px;
  border:none;
}

button{
  padding:8px 15px;
  margin:5px;
  background:red;
  color:#fff;
  border:none;
  cursor:pointer;
  border-radius:5px;
}

/* PANEL */
#panel{
  display:none;
}

.key{
  background:#111;
  margin:10px auto;
  padding:15px;
  border-radius:10px;
  width:280px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>Login</h2>
  <input id="user" placeholder="Usuário"><br>
  <input id="pass" type="password" placeholder="Senha"><br>
  <button onclick="login()">Entrar</button>
</div>

<!-- PAINEL -->
<div id="panel">
  <h2>Gerador de Keys</h2>

  <button onclick="gerar(1)">1 Dia</button>
  <button onclick="gerar(7)">7 Dias</button>
  <button onclick="gerar(20)">20 Dias</button>
  <button onclick="gerar(50)">50 Dias</button>

  <h2>Keys Criadas</h2>
  <div id="keys"></div>
</div>

<script>

/* LOGIN */
function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u === "gabriel-12" && p === "040612"){
    document.getElementById("login").style.display="none";
    document.getElementById("panel").style.display="block";
  }else{
    alert("Login errado");
  }
}

/* GERAR KEY */
function gerar(dias){

  let key = "GAB-" + dias + "D-" + Math.random().toString(36).substring(2,10).toUpperCase();

  let exp = Date.now() + dias*86400000;

  let status = "Ativa";

  let html = `
    <div class="key">
      <b>${key}</b><br>
      Status: ${status}<br>
      Expira: ${new Date(exp).toLocaleString()}<br><br>

      <button onclick="this.parentElement.remove()">Deletar</button>
      <button onclick="this.innerText='Pausado'">Pausar</button>
    </div>
  `;

  document.getElementById("keys").innerHTML += html;
}

</script>

</body>
</html>
